name: Synkronisera hemmamatcher
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      team_id:
        description: "Lagets UUID (tomt = alla synkaktiverade lag)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: swehockey-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          SYNC_TEAM_ID: ${{ inputs.team_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
